<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">

	<title>IFrame Preview - Embed Any Website</title>
	<meta name="description" content="Preview any website in an embedded iframe with flexible layout options">

	<!-- Open Graph -->
	<meta property="og:title" content="IFrame Preview - Embed Any Website">
	<meta property="og:description" content="Preview any website in an embedded iframe with flexible layout options">
	<meta property="og:type" content="website">
	<meta property="og:image" content="https://cdn.pixabay.com/photo/2015/03/26/09/41/chain-690088_960_720.jpg">
	<meta property="og:image:secure_url" content="https://cdn.pixabay.com/photo/2015/03/26/09/41/chain-690088_960_720.jpg">
	<meta property="og:image:width" content="960">
	<meta property="og:image:height" content="539">
	<meta property="og:image:alt" content="IFrame Preview">

	<link rel="stylesheet" href="/src/styles.css">
</head>
<body>
	<nav>
		<input
			id="iframe-input"
			type="text"
			placeholder="Enter a URL to preview (e.g., example.com)"
			aria-label="URL to preview"
			autocomplete="url"
		>
		<button id="iframe-button" aria-label="Load URL in iframe">
			Load Preview
		</button>
		<div class="checkbox-container">
			<input id="iframe-checkbox" type="checkbox" aria-label="Toggle flexible height mode">
			<label for="iframe-checkbox">Flexible height</label>
		</div>
	</nav>
	<main>
		<iframe
			id="iframe"
			title="Website preview"
			scrolling="no"
			sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
		></iframe>
	</main>

	<script type="module" src="/src/main.ts"></script>
</body>
</html>
